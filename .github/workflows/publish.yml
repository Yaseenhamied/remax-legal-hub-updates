name: Publish a release
# A new version is pushed to the "incoming" branch as latest.json plus the installer split into parts
# (GitHub files must be under 100 MB). This joins the parts, checks the SHA-256, publishes the
# release that the app reads, and deletes the incoming branch.
on:
  push:
    branches: [incoming]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: incoming
      - name: Join and check the installer
        id: v
        run: |
          set -euo pipefail
          VER=$(jq -r .version latest.json); FILE=$(jq -r .file latest.json); SHA=$(jq -r .sha256 latest.json)
          cat parts/part-* > "$FILE"
          echo "$SHA  $FILE" | sha256sum -c -
          echo "ver=$VER" >> "$GITHUB_OUTPUT"; echo "file=$FILE" >> "$GITHUB_OUTPUT"
      - name: Publish release v${{ steps.v.outputs.ver }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.v.outputs.ver }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "${{ steps.v.outputs.file }}" latest.json \
            --title "REMAX Legal HUB ${{ steps.v.outputs.ver }}" --notes-file notes.md --target main --latest
      - name: Remove the incoming branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/incoming"
